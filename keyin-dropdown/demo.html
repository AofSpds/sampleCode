<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Key-in Dropdown - input 전용 예제</title>
<!-- 독립 데모용 CDN. 운영 JSP에서는 기존 jQuery/jQuery UI를 사용한다. -->
<link rel="stylesheet" href="https://code.jquery.com/ui/1.10.4/themes/base/jquery-ui.css">
<link rel="stylesheet" href="keyin-dropdown.css">
<style>
    body { margin: 10px; font: 12px Arial, sans-serif; color: #777; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 4px 8px; }
    th { font-weight: normal; background: #f6f6f6; }
</style>
</head>
<body>
<table>
    <tr>
        <th>구매요청유형</th>
        <td colspan="3">
            <input type="text" id="rTypeCombo" value="전체"
                   style="width:250px;" autocomplete="off">
        </td>
    </tr>
    <tr>
        <th>상태 (AJAX)</th>
        <td colspan="3">
            <input type="text" id="statusCombo" placeholder="검색 또는 선택"
                   style="width:180px;" autocomplete="off">
        </td>
    </tr>
</table>
<script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.10.4/jquery-ui.min.js"></script>
<script src="keyin-dropdown.js"></script>
<script>
$(function () {
    // 고정 옵션
    $('#rTypeCombo').keyinDropdown({
        name: 'rTypeCd',
        initialCode: 'ALL',
        listWidth: 330,
        options: [
            { code: 'ALL', codeLabel: '전체' },
            { code: 'A', codeLabel: '자재' },
            { code: 'B', codeLabel: '시설투자' },
            { code: 'C', codeLabel: '용역' }
        ],
        onKeyin: function (text) { console.log('직접입력:', text); },
        onSelect: function (item) { console.log('옵션선택:', item.code, item.codeLabel); },
        onClear: function () { console.log('초기화'); }
    });

    // AJAX 옵션 (파일 직접 열기 대신 HTTP 서버에서 테스트)
    $('#statusCombo').keyinDropdown({
        name: 'statusCd',
        ajax: { url: 'mock-options.json', type: 'GET' },
        listWidth: 260,
        onSelect: function (item) { console.log('AJAX선택:', item.code, item.codeLabel); },
        onError: function (xhr) { console.log('AJAX오류:', xhr.status); }
    });
});
</script>
</body>
</html>
