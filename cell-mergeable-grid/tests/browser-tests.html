<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>CellMergeableGrid Browser Tests</title>
</head>
<body>
    <h1>CellMergeableGrid Browser Tests</h1>
    <table id="grid" class="existing-table">
        <colgroup><col><col><col><col><col></colgroup>
    </table>
    <pre id="results" data-status="running">RUNNING</pre>
    <script src="../CellMergeableGrid.js"></script>
    <script>
    (function () {
        "use strict";
        var logs = [];
        var passed = 0;
        var failed = 0;
        var table = document.getElementById("grid");
        var initial = [
            {key1:"A", key2:"01", qty:10, status:"<img src=x>", hidden:100},
            {key1:"A", key2:"02", qty:20, status:"완료", hidden:101},
            {key1:"B", key2:"01", qty:30, status:"대기", hidden:102},
            {key1:"B", key2:"02", qty:40, status:"완료", hidden:103}
        ];
        function check(condition, msg) {
            if (!condition) { throw new Error(msg || "assertion failed"); }
        }
        function same(actual, expected, msg) {
            check(JSON.stringify(actual) === JSON.stringify(expected),
                (msg || "not equal") + " actual=" + JSON.stringify(actual) +
                " expected=" + JSON.stringify(expected));
        }
        function test(name, fn) {
            try {
                fn();
                passed++;
                logs.push("PASS " + name);
            } catch (error) {
                failed++;
                logs.push("FAIL " + name + " — " + error.message);
            }
        }
        function signalChange(element) {
            element.dispatchEvent(new Event("change", {bubbles:true}));
        }

        var selectionEvents = [];
        var changes = [];
        var grid = new CellMergeableGrid(table, {
            keyFields: ["key1", "key2"],
            columns: [
                {type:"radio",title:"선택"},
                {field:"key1",title:"그룹",merge:true},
                {field:"key2",title:"항목"},
                {field:"qty",title:"수량",editor:"number",onChange:function (value,row) {
                    changes.push({value:value,row:row});
                }},
                {field:"status",title:"상태",renderer:function (value) {return value;}}
            ],
            onSelect:function (row) {selectionEvents.push(row);}
        });

        test("setRows deep copy, no input mutation", function () {
            grid.setRows(initial);
            initial[0].qty = 999;
            check(grid.getRows()[0].qty === 10, "external mutation leaked in");
        });
        test("only key1 td is merged, rowspan=2, radio td remains on each row", function () {
            var rows = table.tBodies[0].rows;
            check(rows.length === 4);
            check(rows[0].cells[1].rowSpan === 2, "first A colspan/rowspan wrong");
            check(rows[1].cells.length === 4, "merged second row has extra td");
            check(rows[2].cells[1].rowSpan === 2, "B merge wrong");
            check(table.querySelectorAll("input[type=radio]").length === 4, "radio was merged");
        });
        test("native radio name must equal key1, one name per group", function () {
            var radios = table.querySelectorAll("input[type=radio]");
            same([radios[0].name, radios[1].name, radios[2].name, radios[3].name],
                ["A","A","B","B"]);
        });
        test("original table class and colgroup are retained", function () {
            check(table.className === "existing-table");
            check(table.querySelector("colgroup") !== null);
        });
        test("untrusted row strings are rendered as text, not HTML", function () {
            check(table.querySelectorAll("img").length === 0);
            check(table.tBodies[0].rows[0].cells[4].textContent === "<img src=x>");
        });
        test("radio selection is independent per key1", function () {
            var radios = table.querySelectorAll("input[type=radio]");
            radios[1].checked = true;
            signalChange(radios[1]);
            radios[2].checked = true;
            signalChange(radios[2]);
            same(grid.getSelectedKeys(), [{key1:"A",key2:"02"},{key1:"B",key2:"01"}]);
            check(selectionEvents.length === 2);
        });
        test("getSelectedRows returns original complete JSON objects, no wrapper", function () {
            var chosen = grid.getSelectedRows();
            same(chosen, [
                {key1:"A",key2:"02",qty:20,status:"완료",hidden:101},
                {key1:"B",key2:"01",qty:30,status:"대기",hidden:102}
            ]);
            chosen[0].qty = 1000;
            check(grid.getSelectedRows()[0].qty === 20, "returned object leaked changes");
        });
        test("editor updates only the corresponding row", function () {
            var editors = table.querySelectorAll('input[type="number"]');
            editors[1].value = "25";
            signalChange(editors[1]);
            check(grid.getSelectedRows()[0].qty === 25);
            check(grid.getRows()[0].qty === 10);
            check(changes.length === 1 && changes[0].row.qty === 25);
        });
        test("render and setRows preserve valid composite-key selections", function () {
            grid.render();
            check(table.querySelectorAll('input[type="radio"]:checked').length === 2);
            var all = grid.getRows();
            all[0].qty = 11;
            grid.setRows(all);
            same(grid.getSelectedKeys(), [{key1:"A",key2:"02"},{key1:"B",key2:"01"}]);
        });
        test("setRows prunes deleted selection but retains remaining group", function () {
            var filtered = grid.getRows().filter(function (r) {return r.key2 !== "02" || r.key1 !== "A";});
            grid.setRows(filtered);
            same(grid.getSelectedKeys(), [{key1:"B",key2:"01"}]);
        });
        test("setSelectedKeys restores selection and ignores unknown rows", function () {
            grid.setSelectedKeys([{key1:"A",key2:"01"},{key1:"B",key2:"02"},{key1:"X",key2:"99"}]);
            same(grid.getSelectedKeys(), [{key1:"A",key2:"01"},{key1:"B",key2:"02"}]);
        });
        test("updateRow can update only non-key fields", function () {
            check(grid.updateRow({key1:"B",key2:"02"},{qty:88}) === true);
            check(grid.getRows().filter(function (r) {return r.key1==="B"&&r.key2==="02";})[0].qty===88);
            var rejected = false;
            try {grid.updateRow({key1:"B",key2:"02"},{key1:"C"});} catch(e) {rejected=true;}
            check(rejected);
        });
        test("duplicate composite key throws", function () {
            var rejected = false;
            try {grid.setRows([{key1:"X",key2:"01"},{key1:"X",key2:"01"}]);}
            catch (e) {rejected=true;}
            check(rejected);
        });
        test("non-adjacent key1 rows are grouped visually and rowspan-merged", function () {
            var source = [
                {key1:"A",key2:"01",qty:1},
                {key1:"B",key2:"01",qty:2},
                {key1:"A",key2:"02",qty:3}
            ];
            grid.setRows(source);
            var tr = table.tBodies[0].rows;
            check(tr[0].cells.length === 5 && tr[0].cells[1].rowSpan === 2,
                "first group must merge A/01 + A/02");
            check(tr[1].cells.length === 4, "second A must omit merged key1 td");
            check(tr[2].cells.length === 5, "B group must have its own key1 td");
            var radios = table.querySelectorAll("input[type=radio]");
            same([radios[0].name, radios[1].name, radios[2].name], ["A","A","B"]);
            same([radios[0].value, radios[1].value, radios[2].value], ["01","02","01"]);
            same(grid.getRows(), source, "getRows must keep supplied JSON array order");
            grid.setSelectedKeys([{key1:"A",key2:"02"},{key1:"B",key2:"01"}]);
            same(grid.getSelectedRows(), [source[1],source[2]], "selected JSON retains original order");
        });
        test("interleaved product rows render merged and edit the intended source row", function () {
            var source = [
                {key1:"100110",key2:"01",qty:10,status:"대기"},
                {key1:"100111",key2:"02",qty:20,status:"완료"},
                {key1:"100112",key2:"01",qty:30,status:"대기"},
                {key1:"100110",key2:"02",qty:40,status:"완료"}
            ];
            grid.setRows(source);
            var tr = table.tBodies[0].rows;
            check(tr.length === 4);
            check(tr[0].cells[1].rowSpan === 2, "100110 must have rowspan 2");
            check(tr[1].cells.length === 4, "second 100110 row must omit key cell");
            var radios = table.querySelectorAll("input[type=radio]");
            same([radios[0].name,radios[1].name,radios[2].name,radios[3].name],
                ["100110","100110","100111","100112"]);
            same(grid.getRows(),source,"internal JSON remains in original order");
            radios[1].checked = true;
            signalChange(radios[1]);
            radios[2].checked = true;
            signalChange(radios[2]);
            same(grid.getSelectedRows(), [source[1],source[3]]);
            var editors=table.querySelectorAll('input[type="number"]');
            editors[1].value="45";
            signalChange(editors[1]);
            check(grid.getRows()[3].qty===45, "editing display row 2 must edit original row 4");
            check(grid.getRows()[1].qty===20, "unrelated original row must remain intact");
            check(grid.getSelectedRows()[1].qty===45, "edited selection must be reflected");
            grid.render();
            check(table.tBodies[0].rows[0].cells[1].rowSpan===2, "rerender must retain merge");
            check(table.querySelectorAll('input[type="radio"]:checked').length===2,
                "rerender must retain radio selection");
        });
        // Three-part row identity: two group fields + one supplier field.
        var tripleTable = document.createElement("table");
        var tripleRows = [
            {itemCd:"10",matCd:"100510",VendorWebId:"100002",vendorName:"Alpha",qty:10,bizRegNo:"111"},
            {itemCd:"20",matCd:"200110",VendorWebId:"100002",vendorName:"Alpha",qty:20,bizRegNo:"111"},
            {itemCd:"10",matCd:"100510",VendorWebId:"100006",vendorName:"Beta",qty:30,bizRegNo:"222"},
            {itemCd:"10",matCd:"999999",VendorWebId:"100008",vendorName:"Gamma",qty:40,bizRegNo:"333"},
            {itemCd:"20",matCd:"200110",VendorWebId:"100010",vendorName:"Delta",qty:50,bizRegNo:"444"},
            {itemCd:"10",matCd:"999999",VendorWebId:"100009",vendorName:"Epsilon",qty:60,bizRegNo:"555"}
        ];
        var editContexts = [];
        var selectContexts = [];
        var triple = new CellMergeableGrid(tripleTable, {
            keyFields:["itemCd","matCd","VendorWebId"],
            columns:[
                {type:"radio",title:"선택"},
                {field:"itemCd",title:"품목",merge:true},
                {field:"matCd",title:"자재코드",merge:true},
                {field:"VendorWebId",title:"업체코드"},
                {field:"vendorName",title:"업체명"},
                {field:"qty",title:"수량",editor:"number",onChange:function(v,r,ctx){editContexts.push(ctx);}}
            ],
            onSelect:function(r,ctx){selectContexts.push(ctx);}
        });
        test("3-key config merges both itemCd and matCd by their pair", function () {
            triple.setRows(tripleRows);
            var tr=tripleTable.tBodies[0].rows;
            check(tr.length===6,"six supplier rows expected");
            check(tr[0].cells.length===6 && tr[0].cells[1].rowSpan===2 &&
                tr[0].cells[2].rowSpan===2,"first pair must merge both group cells");
            check(tr[1].cells.length===4,"second supplier needs radio, vendor, name, qty only");
            check(tr[2].cells.length===6 && tr[2].cells[1].rowSpan===2 &&
                tr[2].cells[2].rowSpan===2,"second pair must merge both group cells");
            check(tr[4].cells.length===6 && tr[4].cells[1].rowSpan===2 &&
                tr[4].cells[2].rowSpan===2,"same item but different material must start new group");
            same(triple.getRows(),tripleRows,"getRows retains original interleaved order");
        });
        test("3-key radio name includes both group keys, value is VendorWebId", function () {
            var radios=tripleTable.querySelectorAll("input[type=radio]");
            same(radios.map(function(r){return r.name;}),[
                '["10","100510"]','["10","100510"]',
                '["20","200110"]','["20","200110"]',
                '["10","999999"]','["10","999999"]'
            ]);
            same(radios.map(function(r){return r.value;}),[
                "100002","100006","100002","100010","100008","100009"
            ]);
        });
        test("3-key groups select independently even if supplier code repeats", function () {
            triple.setSelectedKeys([
                {itemCd:"10",matCd:"100510",VendorWebId:"100006"},
                {itemCd:"20",matCd:"200110",VendorWebId:"100002"},
                {itemCd:"10",matCd:"999999",VendorWebId:"100009"}
            ]);
            same(triple.getSelectedKeys(),[
                {itemCd:"20",matCd:"200110",VendorWebId:"100002"},
                {itemCd:"10",matCd:"100510",VendorWebId:"100006"},
                {itemCd:"10",matCd:"999999",VendorWebId:"100009"}
            ]);
            same(triple.getSelectedRows(),[tripleRows[1],tripleRows[2],tripleRows[5]]);
            check(tripleTable.querySelectorAll('input[type="radio"]:checked').length===3);
        });
        test("3-key display edit updates correct original JSON row and callback context", function () {
            var editors=tripleTable.querySelectorAll('input[type="number"]');
            editors[1].value="77";
            signalChange(editors[1]);
            check(triple.getRows()[2].qty===77,"second displayed row must map to source row 3");
            check(triple.getRows()[1].qty===20,"unrelated row must not change");
            check(triple.getSelectedRows()[1].qty===77,"edited selected row must be exported");
            same(editContexts[0].key,{itemCd:"10",matCd:"100510",VendorWebId:"100006"});
            check(editContexts[0].rowIndex===2,"rowIndex must be original index");
            var radios=tripleTable.querySelectorAll("input[type=radio]");
            radios[3].checked=true;
            signalChange(radios[3]);
            check(selectContexts[0].rowIndex===4);
            same(selectContexts[0].key,{itemCd:"20",matCd:"200110",VendorWebId:"100010"});
            same(triple.getSelectedRows().map(function(r){return r.VendorWebId;}),["100006","100010","100009"]);
        });
        test("3-key selection survives render / setRows and prunes absent supplier", function () {
            var chosen=triple.getSelectedKeys();
            triple.render();
            same(triple.getSelectedKeys(),chosen);
            triple.setRows(triple.getRows());
            same(triple.getSelectedKeys(),chosen);
            triple.setRows(triple.getRows().filter(function(r) {
                return !(r.itemCd==="10" && r.matCd==="100510" && r.VendorWebId==="100006");
            }));
            same(triple.getSelectedKeys(),[
                {itemCd:"20",matCd:"200110",VendorWebId:"100010"},
                {itemCd:"10",matCd:"999999",VendorWebId:"100009"}
            ]);
        });
        test("3-key rejects duplicate full identity and missing third key", function () {
            var rejected=false;
            try {triple.setRows([tripleRows[0],tripleRows[0]]);}
            catch(e){rejected=true;}
            check(rejected,"duplicate triple must be rejected");
            rejected=false;
            try {triple.setRows([{itemCd:"10",matCd:"100510"}]);}
            catch(e){rejected=true;}
            check(rejected,"missing supplier key must be rejected");
            rejected=false;
            try {triple.setSelectedKeys([{itemCd:"10",matCd:"100510"}]);}
            catch(e){rejected=true;}
            check(rejected,"selection requires all 3 keys");
        });
        test("3-key vendor and other key fields are immutable", function () {
            var rejected=false;
            try {triple.updateRow(
                {itemCd:"10",matCd:"100510",VendorWebId:"100002"},
                {VendorWebId:"new"}
            );} catch(e) {rejected=true;}
            check(rejected,"updating row identity must be rejected");
            rejected=false;
            try {new CellMergeableGrid(document.createElement("table"),{
                keyFields:["itemCd","matCd","VendorWebId"],
                columns:[{type:"radio"},{field:"VendorWebId",merge:true}]
            });} catch(e){rejected=true;}
            check(rejected,"supplier column cannot merge");
            rejected=false;
            try {new CellMergeableGrid(document.createElement("table"),{
                keyFields:["itemCd","matCd","VendorWebId"],
                columns:[{type:"radio"},{field:"matCd",editor:"text"}]
            });} catch(e){rejected=true;}
            check(rejected,"group key cannot be edited");
        });
        test("2-key behavior and group radio name are backward compatible", function () {
            var simple = new CellMergeableGrid(document.createElement("table"),{
                keyFields:["key1","key2"],
                columns:[{type:"radio"},{field:"key1",merge:true},{field:"key2"}]
            });
            simple.setRows([{key1:"A",key2:"01"},{key1:"A",key2:"02"}]);
            same(simple.table.querySelectorAll("input[type=radio]").map(function(r){return r.name;}),["A","A"]);
            simple.destroy();
            triple.destroy();
        });
        test("clearSelection and destroy release markup", function () {
            grid.clearSelection();
            check(grid.getSelectedRows().length === 0);
            grid.destroy();
            check(table.querySelectorAll("thead, tbody").length === 0);
            check(table.className === "existing-table");
        });

        var result = document.getElementById("results");
        result.setAttribute("data-status", failed ? "fail" : "pass");
        result.textContent = "RESULT: " + passed + " passed, " + failed +
            " failed\n" + logs.join("\n");
    }());
    </script>
</body>
</html>
