<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>CellMergeableGrid — itemCd + matCd + VendorWebId</title>
    <link rel="stylesheet" href="demo.css">
</head>
<body>
    <h1>CellMergeableGrid — 3개 키 / 2개 컬럼 병합</h1>
    <div class="note">품목 ASC → 자재코드 ASC · 그룹별 공급업체 단일 선택 · JSON 원본 순서 유지. 데모 CSS만 사용합니다.</div>

    <div class="controls">
        <button id="show-selected">선택 행 JSON 추출</button>
        <button id="show-all">전체 JSON 추출</button>
        <button id="rerender">재렌더링 (선택 유지)</button>
        <button id="regenerate">랜덤 데이터 다시 생성</button>
        <button id="clear">선택 해제</button>
    </div>
    <table id="grid" class="demo-grid-table">
        <colgroup>
            <col style="width: 8%">
            <col style="width: 10%">
            <col style="width: 18%">
            <col style="width: 14%">
            <col style="width: 32%">
            <col style="width: 18%">
        </colgroup>
    </table>

    <h2>입력 JSON 배열 (사업자번호 포함)</h2>
    <textarea id="source" spellcheck="false"></textarea>
    <div class="controls">
        <button id="apply">JSON 입력 적용 (setRows)</button>
    </div>
    <h2>결과</h2>
    <div id="message" aria-live="polite"></div>
    <pre id="output">Radio를 선택하고 「선택 행 JSON 추출」을 눌러보세요.</pre>

    <script src="../CellMergeableGrid.js"></script>
    <script>
    (function () {
        "use strict";
        var itemMatCodes = [
            { itemCd:"10", matCd:"100510" },
            { itemCd:"20", matCd:"200110" },
            { itemCd:"30", matCd:"300001" },
            { itemCd:"50", matCd:"402030" }
        ];
        var vendors = [
            ["100002","(주)엘지상사","1168118686"],
            ["100006","(주)홍보실업","2018145273"],
            ["100007","동진P&P","2020191647"],
            ["100008","무림페이퍼(주)","6108102842"],
            ["100009","동화산업(주)","1108101682"],
            ["100010","성우산업(주)","1108123575"],
            ["100011","원우상사","2071045188"],
            ["100012","협일통상","1351595791"],
            ["100013","(주)경인양행","1378100562"],
            ["100014","(주)대림화학","6138100810"],
            ["100015","(주)동양화공","5148123364"],
            ["100016","(주)삼양제넥스(인천)","1378502364"],
            ["100017","(주)수양","5148135690"],
            ["100018","(주)신동방CP","1078134789"],
            ["100019","(주)에스와이켐","3128105265"],
            ["100022","(주)오미아코리아 안동공장","5088501835"],
            ["100023","(주)위더스켐상사","2138639731"],
            ["100024","(주)유레카종합실업","2078154071"],
            ["100025","(주)이레자원","1048166282"],
            ["100026","(주)일성무역","2158137239"],
            ["100027","(주)정우정밀화학","1248138534"],
            ["100028","(주)정원화학","6038128922"],
            ["100029","(유)수에즈워터테크놀로지","4038107502"]
        ];
        function shuffle(values) {
            for (var i = values.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = values[i];
                values[i] = values[j];
                values[j] = tmp;
            }
            return values;
        }
        function createDemoRows() {
            var count = 14 + Math.floor(Math.random() * 8);
            var sizes = [2,2,2,2];
            var rows = [];
            for (var i = 8; i < count; i++) {
                sizes[Math.floor(Math.random() * sizes.length)]++;
            }
            itemMatCodes.forEach(function(pair, index) {
                shuffle(vendors.slice()).slice(0,sizes[index]).forEach(function(v) {
                    rows.push({
                        itemCd:pair.itemCd,
                        matCd:pair.matCd,
                        VendorWebId:v[0],
                        vendorName:v[1],
                        bizRegNo:v[2],
                        qty:10+Math.floor(Math.random()*190)
                    });
                });
            });
            return shuffle(rows);
        }

        var source = document.getElementById("source");
        var output = document.getElementById("output");
        var message = document.getElementById("message");
        function report(label, value) {
            message.textContent = label;
            output.textContent = JSON.stringify(value, null, 2);
        }
        var grid = new CellMergeableGrid("#grid", {
            keyFields:["itemCd","matCd","VendorWebId"],
            groupOrder:"asc", // 품목 ASC, 다음 자재코드 ASC
            columns:[
                {type:"radio",title:"선택"},
                {field:"itemCd",title:"품목",merge:true,className:"group-cell"},
                {field:"matCd",title:"자재코드",merge:true,className:"group-cell"},
                {field:"VendorWebId",title:"업체코드"},
                {field:"vendorName",title:"업체명"},
                {field:"qty",title:"수량",editor:"number",onChange:function(value,row) {
                    message.textContent = row.itemCd+" / "+row.matCd+" / "+row.VendorWebId+" 수량: "+value;
                }}
            ],
            onSelect:function(row) {
                message.textContent = row.itemCd+" / "+row.matCd+" → "+row.vendorName+" 선택";
            }
        });
        function applyRows(rows) {
            grid.setRows(rows);
            source.value = JSON.stringify(grid.getRows(), null, 2);
        }
        function seedSelections() {
            var seen = Object.create(null);
            var keys = [];
            grid.getRows().forEach(function(row) {
                var id = JSON.stringify([row.itemCd,row.matCd]);
                if (!seen[id]) {
                    seen[id] = true;
                    keys.push({
                        itemCd:row.itemCd,
                        matCd:row.matCd,
                        VendorWebId:row.VendorWebId
                    });
                }
            });
            grid.setSelectedKeys(keys);
        }
        applyRows(createDemoRows());
        seedSelections();
        document.getElementById("show-selected").onclick=function() {
            report("getSelectedRows(): 공급업체 선택 행 JSON 배열",grid.getSelectedRows());
        };
        document.getElementById("show-all").onclick=function() {
            report("getRows(): 원본 입력 순서의 전체 JSON 배열",grid.getRows());
        };
        document.getElementById("rerender").onclick=function() {
            grid.render();
            report("render() 후 선택 유지",grid.getSelectedKeys());
        };
        document.getElementById("regenerate").onclick=function() {
            applyRows(createDemoRows());
            seedSelections();
            report("새 랜덤 행 생성",grid.getSelectedRows());
        };
        document.getElementById("clear").onclick=function() {
            grid.clearSelection();
            report("선택 해제",grid.getSelectedRows());
        };
        document.getElementById("apply").onclick=function() {
            try {
                applyRows(JSON.parse(source.value));
                report("JSON 적용 완료",grid.getSelectedRows());
            } catch(e) {
                message.textContent="입력 오류: "+e.message;
            }
        };
    }());
    </script>
</body>
</html>
